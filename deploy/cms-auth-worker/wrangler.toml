# Cloudflare Worker config for the MGIRL CMS shared-code auth gate.
# Deploy with:  npx wrangler deploy   (run inside deploy/cms-auth-worker/)
#
# First-time setup:
#   npm install -g wrangler         # or use npx
#   npx wrangler login              # opens browser, log into Cloudflare (free)
#   npx wrangler secret put ADMIN_CODE      # paste the shared code admins type
#   npx wrangler secret put GITHUB_TOKEN    # paste the fine-grained PAT
#   npx wrangler deploy
#
# After deploy, Wrangler prints a URL like:
#   https://mgirl-cms-auth.<your-subdomain>.workers.dev
# Put that URL into public/admin/config.yml -> backend.base_url

name = "mgirl-cms-auth"
main = "worker.js"
compatibility_date = "2024-11-01"

# Secrets (ADMIN_CODE, GITHUB_TOKEN) are NOT set here — they are added with
# `wrangler secret put` so they never end up in source control.
